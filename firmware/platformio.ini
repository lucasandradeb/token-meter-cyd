; PlatformIO — Token Meter (ESP32-2432S028 / CYD)
;
; Dois ambientes:
;   [env:bringup] — teste isolado de hardware (display + touch). Passo 1.
;   [env:app]     — firmware completo (LVGL + BLE). Adicionado nos passos seguintes.
;
; No VSCode: selecione o ambiente na barra inferior do PlatformIO, depois
; use os botoes Build (check) e Upload (seta). A porta /dev/cu.usbserial-110
; e auto-detectada.

[platformio]
default_envs = bringup

; ---- Configuracao comum a todos os ambientes ----
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; A CYD usa o CH340; velocidade de upload segura e universal.
upload_speed = 460800

; ==========================================================================
; BRING-UP — valida display e touch antes de investir no firmware completo.
; ==========================================================================
[env:bringup]
build_src_filter = +<bringup/> -<app/>
lib_deps =
    ; Fixo em 1.4.9: versoes 1.5+ exigem Arduino-ESP32 core 3.x
    ; (esp32-hal-periman.h), que o platform espressif32 padrao nao traz.
    moononournation/GFX Library for Arduino@1.4.9
    ; Registro do PlatformIO so publica um alpha desta lib; usamos o repo
    ; oficial (MIT) fixado, que expoe a mesma API XPT2046_Touchscreen.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ==========================================================================
; APP — firmware completo (LVGL + BLE). Em construcao, passo a passo.
; ==========================================================================
[env:app]
build_src_filter = +<app/> -<bringup/>
build_flags =
    ; --- LVGL 9: configuracao via flags (sem lv_conf.h) ---
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    ; Sem PSRAM: sem snapshot de tela cheia.
    -DLV_USE_SNAPSHOT=0
    ; Widgets usados pela UI.
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_OBJ=1
    ; Fontes.
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_28=1
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl@^9.2.0
